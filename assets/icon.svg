<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#161d2a"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagonal Card -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="244" height="244" rx="42" fill="none" stroke="#232b3e" stroke-width="3"/>

  <!-- Outer Glowing Tachometer Arc -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="420 180" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Central Fan Blades (Group with rotation) -->
  <g transform="translate(128, 128)" filter="url(#neonGlow)">
    <!-- Blade 1 -->
    <path d="M0,0 C15,-20 45,-35 60,-15 C75,5 45,30 0,0 Z" fill="url(#bladeGrad)" opacity="0.9"/>
    <!-- Blade 2 -->
    <path d="M0,0 C15,-20 45,-35 60,-15 C75,5 45,30 0,0 Z" fill="url(#bladeGrad)" opacity="0.9" transform="rotate(72)"/>
    <!-- Blade 3 -->
    <path d="M0,0 C15,-20 45,-35 60,-15 C75,5 45,30 0,0 Z" fill="url(#bladeGrad)" opacity="0.9" transform="rotate(144)"/>
    <!-- Blade 4 -->
    <path d="M0,0 C15,-20 45,-35 60,-15 C75,5 45,30 0,0 Z" fill="url(#bladeGrad)" opacity="0.9" transform="rotate(216)"/>
    <!-- Blade 5 -->
    <path d="M0,0 C15,-20 45,-35 60,-15 C75,5 45,30 0,0 Z" fill="url(#bladeGrad)" opacity="0.9" transform="rotate(288)"/>

    <!-- Central Hub -->
    <circle cx="0" cy="0" r="24" fill="#11151f" stroke="#00f0ff" stroke-width="3"/>
    <!-- "G" Turbo Lettering -->
    <text x="0" y="7" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>
  </g>
</svg>
